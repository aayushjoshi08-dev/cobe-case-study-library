<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Case Study Library — Centre of Business Excellence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#13201F; --ink2:#1D3331; --paper:#FAF8F3; --card:#FFFFFF;
  --gold:#C8A24A; --pod:#6E59C7; --gold-soft:#E7D4A4; --gold-tint:#FBF6E9;
  --line:#E4DDCF; --muted:#6B7674; --soft:#F1ECE1;
  --revenue:#0E8A5F; --profit:#C8862A; --cash:#1E7FA8; --debt:#7A4FBF;
  --time:#D4663F; --team:#C0397A; --systems:#3B5BA9; --scale:#0F9B8E; --mktg:#B8543F;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:'Inter',sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased}
.fr{font-family:'Fraunces',Georgia,serif}
.wrap{max-width:1440px;margin:0 auto;padding:0 30px}

header{background:var(--paper);border-bottom:1px solid var(--line);padding:26px 0 0;position:sticky;top:0;z-index:60}
.htop{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;padding-bottom:20px}
.kick{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:2.6px;text-transform:uppercase;color:var(--gold);font-weight:700}
h1{font-family:'Fraunces',serif;font-size:34px;font-weight:400;letter-spacing:-.4px;margin-top:5px;line-height:1.1}
h1 em{font-style:italic;color:var(--gold);font-weight:500}
.sub{font-size:13px;color:var(--muted);margin-top:5px}
.stats{display:flex;border:1px solid var(--line);border-radius:2px;overflow:hidden;background:var(--card)}
.st{padding:12px 20px;text-align:center;border-right:1px solid var(--line)}
.st:last-child{border-right:none}
.st b{display:block;font-family:'Fraunces',serif;font-size:23px;font-weight:500;line-height:1}
.st span{font-family:'JetBrains Mono',monospace;font-size:8.5px;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted);margin-top:3px;display:block}

.ctl{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding-bottom:14px}
.srch{flex:1;min-width:250px;position:relative}
.srch input{width:100%;padding:12px 14px 12px 40px;border:1px solid var(--line);border-radius:2px;font-size:14px;font-family:'Inter',sans-serif;background:var(--card);color:var(--ink)}
.srch input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(200,162,74,.12)}
.srch svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);opacity:.45}
select{padding:12px;border:1px solid var(--line);border-radius:2px;font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.8px;text-transform:uppercase;background:var(--card);color:var(--ink);cursor:pointer;min-width:160px}
select:focus{outline:none;border-color:var(--gold)}
#vidBtn{padding:12px 16px;border:1px solid var(--line);background:var(--card);border-radius:2px;font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);cursor:pointer;font-weight:700}
#vidBtn.on{background:var(--ink);border-color:var(--ink);color:var(--gold-soft)}
#reset{background:none;border:none;color:var(--gold);font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:1px;text-transform:uppercase;font-weight:700;cursor:pointer;padding:12px 4px;text-decoration:underline}

.rail{padding:0 0 20px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.rail .lbl{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:1.8px;text-transform:uppercase;color:var(--muted);font-weight:700;margin-right:4px}
.ar{padding:7px 13px;border:1px solid var(--line);background:var(--card);border-radius:2px;font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:700;letter-spacing:.9px;text-transform:uppercase;cursor:pointer;color:var(--muted);transition:.14s;display:flex;align-items:center;gap:6px}
.ar .dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.ar:hover{border-color:var(--gold);color:var(--ink)}
.ar.on{background:var(--ink);border-color:var(--ink);color:#fff}

main{padding:26px 0 70px}
#cnt{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted);margin-bottom:18px}
#cnt b{color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:22px}
.card{background:var(--card);border:1px solid var(--line);border-radius:3px;overflow:hidden;display:flex;flex-direction:column;transition:.2s}
.card:hover{border-color:var(--gold-soft);box-shadow:0 10px 34px rgba(19,32,31,.09);transform:translateY(-3px)}

.thumb{position:relative;aspect-ratio:16/9;background:var(--ink);cursor:pointer;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover;transition:.35s;display:block}
.card:hover .thumb img{transform:scale(1.04)}
.ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,rgba(19,32,31,.15),rgba(19,32,31,.5))}
.ply{width:54px;height:54px;border-radius:50%;background:var(--gold);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 20px rgba(0,0,0,.35);transition:.18s}
.thumb:hover .ply{transform:scale(1.1)}
.ply:after{content:"";border-left:16px solid var(--ink);border-top:10px solid transparent;border-bottom:10px solid transparent;margin-left:4px}
.vtag.pod{background:var(--pod);color:#fff}
.vtag{position:absolute;top:11px;left:11px;background:var(--gold);color:var(--ink);font-family:'JetBrains Mono',monospace;font-size:8.5px;font-weight:700;letter-spacing:1.4px;padding:4px 9px;border-radius:2px;z-index:2}
.novid{aspect-ratio:16/9;background:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.novid .q{font-family:'Fraunces',serif;font-size:52px;color:var(--gold);line-height:.8;font-style:italic}
.novid span{font-family:'JetBrains Mono',monospace;font-size:8.5px;letter-spacing:2px;text-transform:uppercase;color:var(--gold-soft);font-weight:700}

.bd{padding:18px 19px 19px;flex:1;display:flex;flex-direction:column}
.nm{font-family:'Fraunces',serif;font-size:21px;font-weight:500;line-height:1.15;letter-spacing:-.2px}
.mt{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:1.1px;text-transform:uppercase;color:var(--muted);margin-top:6px;line-height:1.6}

.hero{margin-top:13px;background:var(--gold-tint);border:1px solid var(--gold-soft);border-radius:2px;padding:11px 13px}
.hero .l{font-family:'JetBrains Mono',monospace;font-size:8px;letter-spacing:1.6px;text-transform:uppercase;color:var(--gold);font-weight:700}
.hero .v{font-family:'Fraunces',serif;font-size:19px;font-weight:600;color:var(--ink);margin-top:2px;line-height:1.25}
.mets{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.met{font-family:'JetBrains Mono',monospace;font-size:9px;font-weight:500;color:var(--ink2);background:var(--soft);border:1px solid var(--line);padding:3px 7px;border-radius:2px}

.areas{display:flex;gap:5px;flex-wrap:wrap;margin-top:13px;padding-top:13px;border-top:1px solid var(--line)}
.abadge{display:flex;align-items:center;gap:5px;font-family:'JetBrains Mono',monospace;font-size:8.5px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;padding:4px 8px;border-radius:2px;color:#fff}
.abadge .i{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.85)}

.det{margin-top:14px;border-top:1px solid var(--line);padding-top:13px;display:none}
.card.open .det{display:block}
.det h4{font-family:'JetBrains Mono',monospace;font-size:8.5px;letter-spacing:1.8px;text-transform:uppercase;font-weight:700;margin-bottom:7px}
.det .b h4{color:#B0553F}.det .a h4{color:var(--revenue)}
.det ul{list-style:none;margin-bottom:13px}
.det li{font-size:12.5px;color:var(--ink2);padding:4px 0 4px 15px;position:relative;line-height:1.5}
.det li:before{content:"\2014";position:absolute;left:0;color:var(--gold);font-weight:700}

.acts{margin-top:auto;padding-top:15px;display:flex;gap:8px}
.btn{flex:1;padding:10px;border:1px solid var(--line);background:var(--card);border-radius:2px;font-family:'JetBrains Mono',monospace;font-size:9.5px;font-weight:700;letter-spacing:1.1px;text-transform:uppercase;color:var(--ink);cursor:pointer;transition:.15s}
.btn:hover{border-color:var(--gold);background:var(--gold-tint)}
.btn.g{background:var(--ink);border-color:var(--ink);color:var(--gold-soft)}
.btn.g:hover{background:var(--ink2)}

.modal{display:none;position:fixed;inset:0;background:rgba(19,32,31,.93);z-index:200;align-items:center;justify-content:center;padding:30px}
.modal.on{display:flex}
.mb{width:100%;max-width:1000px;position:relative}
.mb iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:3px;display:block}
.mx{position:absolute;top:-42px;right:0;background:none;border:none;color:var(--gold-soft);font-size:30px;cursor:pointer;line-height:1;font-family:'Fraunces',serif}
.empty{text-align:center;padding:80px 20px}
.empty b{font-family:'Fraunces',serif;font-size:24px;font-weight:400;display:block;margin-bottom:6px}
.empty span{color:var(--muted);font-size:13px}
@media(max-width:640px){.grid{grid-template-columns:1fr}}

.thumb .frameHost{position:absolute;inset:0;background:#000;display:none}
.thumb.playing .frameHost{display:block}
.thumb.playing .ov,.thumb.playing .vtag,.thumb.playing img{display:none}
.thumb .frameHost iframe{width:100%;height:100%;border:0;display:block}
.thumb .xclose{position:absolute;top:9px;right:9px;z-index:5;width:28px;height:28px;border-radius:50%;border:none;background:rgba(19,32,31,.82);color:var(--gold-soft);font-family:'Fraunces',serif;font-size:20px;line-height:1;cursor:pointer;display:none;align-items:center;justify-content:center}
.thumb.playing .xclose{display:flex}
</style></head><body>

</div></header>

const AREAS=["Revenue", "Profit", "Cashflow", "Debt-Free", "Time Freedom", "Team", "Systems", "Scale-Up", "Marketing"];
const COLOR={Revenue:'var(--revenue)',Profit:'var(--profit)',Cashflow:'var(--cash)','Debt-Free':'var(--debt)','Time Freedom':'var(--time)',Team:'var(--team)',Systems:'var(--systems)','Scale-Up':'var(--scale)',Marketing:'var(--mktg)'};
let f={q:'',n:'',s:'',t:'',v:false,a:new Set()};

const isCase=c=>(c.type||'case')!=='podcast';
s1.textContent=CASES.filter(isCase).length;
sp.textContent=CASES.filter(c=>c.type==='podcast').length;
s2.textContent=CASES.filter(c=>isCase(c)&&c.vid).length;
s3.textContent=new Set(CASES.filter(isCase).map(c=>c.nature).filter(Boolean)).size;
s4.textContent=new Set(CASES.map(c=>c.state).filter(Boolean)).size;

AREAS.forEach(a=>{
 const b=document.createElement('button'); b.className='ar';
 b.innerHTML='<span class="dot" style="background:'+COLOR[a]+'"></span>'+a;
 b.onclick=()=>{b.classList.toggle('on'); f.a.has(a)?f.a.delete(a):f.a.add(a); render();};
 document.getElementById('rail').appendChild(b);
});

const esc=s=>String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
function ok(c){
 if(f.n&&c.nature!==f.n)return false;
 if(f.s&&c.state!==f.s)return false;
 if(f.t&&(c.type||'case')!==f.t)return false;
 if(f.v&&!c.vid)return false;
 if(f.a.size&&!c.areas.some(x=>f.a.has(x)))return false;
 if(f.q){const h=(c.name+' '+c.nature+' '+c.product+' '+c.loc+' '+c.before.join(' ')+' '+c.after.join(' ')+' '+c.areas.join(' ')).toLowerCase();
  if(!h.includes(f.q.toLowerCase()))return false;}
 return true;
}
function render(){
 const L=CASES.filter(ok);
 cnt.innerHTML='Showing <b>'+L.length+'</b> of '+CASES.length+' case studies';
 empty.style.display=L.length?'none':'block';
 grid.innerHTML=L.map(c=>{
  const i=CASES.indexOf(c);
  const pod=(c.type==='podcast');
  const media=c.vid
   ? '<div class="thumb" id="thumb-'+c.vid+'" onclick="playV(\''+c.vid+'\')"><img src="https://i.ytimg.com/vi/'+c.vid+'/hqdefault.jpg" loading="lazy" alt=""><div class="vtag'+(pod?' pod':'')+'">'+(pod?'Podcast':'Video')+'</div><div class="ov"><div class="ply"></div></div><button class="xclose" onclick="event.stopPropagation();stopV(\''+c.vid+'\')">&times;</button><div class="frameHost"></div></div>'
   : '<div class="novid"><div class="q fr">&ldquo;</div><span>Written Case Study</span></div>';
  return '<div class="card" id="k'+i+'">'+media+'<div class="bd">'
   +'<div class="nm fr">'+esc(c.name)+'</div>'
   +'<div class="mt">'+esc(c.product||c.nature)+(c.loc?' &nbsp;/&nbsp; '+esc(c.loc):'')+(c.year?' &nbsp;/&nbsp; '+c.year:'')+'</div>'
   +(c.hero
      ? '<div class="hero"><div class="l">'+(pod?'Topic':'Headline Result')+'</div><div class="v fr">'+esc(c.hero)+'</div></div>'
      : (c.after.length ? '<div class="hero"><div class="l">Headline Result</div><div class="v fr" style="font-size:15px;font-weight:500;line-height:1.35">'+esc(c.after[0])+'</div></div>' : ''))
   +((c.stats&&c.stats.length)?'<div class="mets">'+c.stats.map(m=>'<span class="met">'+esc(m)+'</span>').join('')+'</div>':'')
   +'<div class="areas">'+c.areas.map(a=>'<span class="abadge" style="background:'+COLOR[a]+'"><span class="i"></span>'+esc(a)+'</span>').join('')+'</div>'
   +'<div class="det">'
     +(!pod&&c.before.length?'<div class="b"><h4>The Problem</h4><ul>'+c.before.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul></div>':'')
     +(c.after.length?'<div class="a"><h4>'+(pod?'Key Takeaways':'What They Achieved')+'</h4><ul>'+c.after.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul></div>':'')
   +'</div>'
   +'<div class="acts"><button class="btn" id="t'+i+'" data-lbl="'+(pod?'Key Takeaways':'Problem &amp; Solution')+'" onclick="tog('+i+')">'+(pod?'Key Takeaways':'Problem &amp; Solution')+'</button>'
   +(c.vid?'<button class="btn g" onclick="playV(\''+c.vid+'\')">&#9654; '+(pod?'Play Episode':'Play Story')+'</button>':'')+'</div>'
  +'</div></div>';
 }).join('');
}
function tog(i){const e=document.getElementById('k'+i);e.classList.toggle('open');
 const b=document.getElementById('t'+i);b.textContent=e.classList.contains('open')?'Hide Details':b.getAttribute('data-lbl');}
let playingId=null;
function stopV(id){const t=document.getElementById('thumb-'+id);if(!t)return;t.classList.remove('playing');t.querySelector('.frameHost').innerHTML='';if(playingId===id)playingId=null;}
function playV(id){
 if(playingId&&playingId!==id)stopV(playingId);
 const t=document.getElementById('thumb-'+id);if(!t)return;
 if(t.classList.contains('playing'))return;
 t.querySelector('.frameHost').innerHTML='<iframe src="https://www.youtube-nocookie.com/embed/'+id+'?autoplay=1&rel=0&modestbranding=1&playsinline=1" allow="autoplay;encrypted-media;picture-in-picture" allowfullscreen></iframe>';
 t.classList.add('playing');playingId=id;
}
addEventListener('keydown',e=>{if(e.key==='Escape'&&playingId)stopV(playingId)});
q.oninput=e=>{f.q=e.target.value;render()};
fN.onchange=e=>{f.n=e.target.value;render()};
fS.onchange=e=>{f.s=e.target.value;render()};
fT.onchange=e=>{f.t=e.target.value;render()};
vidBtn.onclick=function(){this.classList.toggle('on');f.v=!f.v;render()};
reset.onclick=()=>{f={q:'',n:'',s:'',t:'',v:false,a:new Set()};q.value='';fN.value='';fS.value='';fT.value='';
 vidBtn.classList.remove('on');document.querySelectorAll('.ar').forEach(x=>x.classList.remove('on'));render()};
render();
</script></body></html>
